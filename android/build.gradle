plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.sipvoice'
version = '0.1.0'

android {
  namespace "expo.modules.sipvoice"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  // Headless JS (HeadlessJsTaskService). The version comes from the app's React Native.
  implementation "com.facebook.react:react-android"
}
